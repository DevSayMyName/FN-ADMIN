<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FN SPORT - Módulo de Reclutamiento</title>
  
  <!-- Tipografía Oficial -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS Principal -->
  <link rel="stylesheet" href="../style.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="rec-body">

  <div class="rec-container">
    <!-- Header -->
    <header class="rec-header">
      <div>
        <h1 class="rec-title">MÓDULO DE <span>RECLUTAMIENTO</span></h1>
        <p class="rec-subtitle">Gestión de aspirantes, postulaciones y formulario oficial de FN ESPORT</p>
      </div>

      <!-- Pestañas de Navegación por Estado -->
      <div class="rec-header-actions">
        <!-- <button class="rec-btn-secondary" onclick="switchTab('formView')" id="btnViewForm">
          📄 VER FORMULARIO
        </button> -->
        <button class="rec-btn-secondary active" onclick="switchTab('PENDIENTE')" id="btnViewPending">
          ⏳ PENDIENTES (<span id="pendingCount">0</span>)
        </button>
        <button class="rec-btn-secondary" onclick="switchTab('ACEPTADO')" id="btnViewAccepted">
          ⭐ ACEPTADOS / EVALUACIÓN (<span id="acceptedCount">0</span>)
        </button>
        <button class="rec-btn-secondary" onclick="switchTab('DESCARTADO')" id="btnViewDiscarded">
          🚫 DESCARTADOS (<span id="discardedCount">0</span>)
        </button>
      </div>
    </header>

    <!-- SECCIÓN 1: Formulario de Google Embellecido (Iframe) -->
    <!-- <section class="rec-view-section" id="formView" style="display: none;">
      <div class="rec-form-card">
        <div class="rec-form-topbar">
          <span>Formulario Oficial de Reclutamiento FN SPORT</span>
          <a href="https://forms.gle/zdsKW8pQcQgnY4t28" target="_blank" class="rec-link-external">
            ABRIR EN PESTAÑA NUEVA ↗
          </a>
        </div>
        <div class="rec-iframe-wrapper">
          <iframe 
            src="https://forms.gle/zdsKW8pQcQgnY4t28" 
            width="100%" 
            height="800" 
            frameborder="0" 
            marginheight="0" 
            marginwidth="0">Cargando formulario...</iframe>
        </div>
      </div>
    </section> -->

    <!-- SECCIÓN 2: Panel de Candidatos (En Tiempo Real con Firebase) -->
    <section class="rec-view-section" id="candidatesView">
      
      <!-- Buscador por Texto -->
      <div class="rec-filter-bar">
        <input type="text" id="searchInput" class="form-control" placeholder="🔍 Buscar por nombre, nacionalidad, rol o WhatsApp...">
      </div>

      <!-- Rejilla de Candidatos (Mapeados dinámicamente) -->
      <div class="rec-grid" id="candidatesGrid">
        <!-- Las tarjetas se cargan con reclutamiento.js -->
      </div>
    </section>
  </div>

  <!-- Modal Flotante: Ver Respuestas Completas -->
  <div class="cal-modal-overlay" id="detailsModal">
    <div class="cal-modal-card" style="max-width: 650px; width: 90%;">
      <div class="cal-modal-header">
        <h2>DETALLES DE <span>POSTULACIÓN</span></h2>
        <button class="cal-btn-close" onclick="closeDetailsModal()">&times;</button>
      </div>

      <!-- Contenido de las respuestas dinámicas -->
      <div class="cal-modal-body" id="detailsContent" style="max-height: 60vh; overflow-y: auto; padding: 15px 0;">
      </div>

      <!-- Botones de Acción (Aceptar / Descartar / Borrar) -->
      <div class="cal-modal-actions" id="detailsActions" style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px;">
      </div>
    </div>
  </div>

  <!-- JavaScript Reclutamiento -->
  <script src="reclutamiento.js"></script>
</body>
</html>
