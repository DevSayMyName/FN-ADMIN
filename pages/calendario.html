<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FN ESPORT - Calendario de Eventos</title>
  
  <!-- Tipografía Oficial -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS Principal -->
  <link rel="stylesheet" href="../style.css">

  <!-- Firebase (Librerías para sincronización en tiempo real entre dispositivos) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="cal-body">

  <div class="cal-container">
    <!-- Encabezado -->
    <header class="cal-header">
      <div>
        <h1 class="cal-title">CALENDARIO DE <span>EVENTOS</span></h1>
        <p class="cal-subtitle">Registro centralizado de torneos, partidas y actividades</p>
      </div>
      <button class="cal-btn-primary" onclick="openEventModal()">
        + CREAR EVENTO
      </button>
    </header>

    <!-- Rejilla de Tarjetas -->
    <div class="cal-grid" id="eventsGrid">
      <!-- Se carga dinámicamente -->
    </div>
  </div>

  <!-- Modal Flotante: Crear / Editar Evento -->
  <div class="cal-modal-overlay" id="eventModal">
    <div class="cal-modal-card">
      <div class="cal-modal-header">
        <h2 id="modalTitle">NUEVO <span>EVENTO</span></h2>
        <button class="cal-btn-close" onclick="closeEventModal()">&times;</button>
      </div>

      <form id="eventForm" onsubmit="handleSaveEvent(event)">
        <input type="hidden" id="eventId">

        <div class="form-group">
          <label for="eventName">Nombre del Evento</label>
          <input type="text" id="eventName" class="form-control" placeholder="Ej. Torneo de Exhibición FN" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="eventDateTime">Fecha y Hora</label>
          <input type="datetime-local" id="eventDateTime" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="eventDiscord">Link de Discord</label>
          <input type="url" id="eventDiscord" class="form-control" placeholder="https://discord.gg/..." required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="eventDescription">Descripción del Evento</label>
          <textarea id="eventDescription" class="form-control cal-textarea" rows="3" placeholder="Detalles, reglas o temáticas..." required></textarea>
        </div>

        <div class="cal-modal-actions">
          <button type="button" class="cal-btn-cancel" onclick="closeEventModal()">CANCELAR</button>
          <button type="submit" class="cal-btn-primary">GUARDAR EVENTO</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Script del Calendario -->
  <script src="calendario.js"></script>
</body>
</html>
