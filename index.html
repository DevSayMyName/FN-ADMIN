<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FN SPORT - Acceso Panel Admin</title>
  
  <!-- Tipografía Oficial -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-container" id="loginCard">
    <div class="brand-header">
      <h1>FN <span>SPORT</span></h1>
      <p>Panel de Administración</p>
    </div>

    <!-- Mensaje de Error -->
    <div class="alert-error" id="errorMessage">
      Usuario o contraseña incorrectos
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input 
          type="text" 
          id="username" 
          class="form-control" 
          placeholder="Rol" 
          required 
          autocomplete="off"
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="••••••••••••" 
            required
            autocomplete="off"
          >
          <button type="button" class="btn-toggle-pwd" id="toggleBtn">VER</button>
        </div>
      </div>

      <button type="submit" class="btn-submit">INGRESAR AL PANEL</button>
    </form>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
